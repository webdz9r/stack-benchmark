spring.main.banner-mode=off
spring.application.name=address-book
# The SPA and every other path are served by our own controllers (ARCH-17..19).
spring.web.resources.add-mappings=false
# Keep-alive like the other stacks: Tomcat otherwise closes a connection after 100 requests.
server.tomcat.max-keep-alive-requests=-1
server.tomcat.max-connections=20000
server.tomcat.accept-count=1024
server.shutdown=graceful
# Compression is done by GzipFilter: Tomcat's own skips responses with a strong ETag (HTTP-5).
server.compression.enabled=false
logging.level.root=WARN
logging.level.addressbook=INFO
